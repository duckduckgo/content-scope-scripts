name: Test Snapshots
description: |
    Runs snapshot tests and uploads test reports as artifacts

    If this workflow fails, you can trigger `update-snapshots.yml` from the
    GitHub UI.

on:
    push:
        branches:
            - main
    pull_request:
    merge_group:

permissions:
    contents: read

jobs:
    snapshots:
        timeout-minutes: 10
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Cache node_modules
              id: cache-node-modules
              uses: actions/cache@v6
              with:
                  path: |
                      node_modules
                      injected/node_modules
                      special-pages/node_modules
                      messaging/node_modules
                      types-generator/node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('.nvmrc') }}-${{ hashFiles('**/package-lock.json') }}
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

            - name: Install SF Pro Fonts
              run: |
                  set -euo pipefail
                  curl -L -o SF-Pro.dmg 'https://devimages-cdn.apple.com/design/resources/download/SF-Pro.dmg'
                  hdiutil attach SF-Pro.dmg
                  # Apple renames the package inside the DMG between font
                  # releases. It used to be 'SF Pro Fonts.pkg'; when that name
                  # changed, `installer` failed with "the package path
                  # specified was invalid" and took every snapshot run with
                  # it. Resolve whichever .pkg the mounted volume ships
                  # instead of hard-coding the name.
                  pkg="$(find /Volumes/SFProFonts -maxdepth 1 -name '*.pkg' -print -quit)"
                  if [[ -z "$pkg" ]]; then
                      echo "::error::No .pkg found on /Volumes/SFProFonts; Apple may have changed the DMG layout."
                      ls -la /Volumes/SFProFonts || true
                      hdiutil detach '/Volumes/SFProFonts' || true
                      exit 1
                  fi
                  echo "Installing $pkg"
                  sudo installer -pkg "$pkg" -target /
                  hdiutil detach '/Volumes/SFProFonts'

            - name: Install dependencies
              if: steps.cache-node-modules.outputs.cache-hit != 'true'
              run: npm ci
            - run: npm run build

            - name: 'Clean tree'
              run: 'npm run test-clean-tree'

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - run: npm run test-int-snapshots

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: snapshots-playwright-report
                  path: |
                      special-pages/playwright-report/**
                      special-pages/test-results/**
                      injected/playwright-report/**
                      injected/test-results/**
                  retention-days: 5
