name: Claude Auto Review

# Replaces the retired Cursor Bugbot / Cursor Automation review. Instead of
# waiting for a third-party GitHub App to publish a check run, this calls the
# Claude API directly against the PR diff and posts the result.
#
# Dependabot PRs are excluded: `dependabot-auto-merge.yml` runs the same
# reviewer with the `dependency` profile and would otherwise fight this
# workflow over the same review comment.

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    pull-requests: write

jobs:
    check_membership:
        if: ${{ !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        outputs:
            is_member: ${{ steps.membership.outputs.is_member }}
        steps:
            - name: Verify trusted launcher
              uses: actions/github-script@v9
              id: membership
              with:
                  github-token: ${{ secrets.DAX_PAT }}
                  script: |
                      const prAuthor = context.payload.pull_request.user.login;

                      // For human-authored PRs the PR author IS the launcher
                      // — check team membership against them. For bot-authored
                      // PRs the author is never a team member, so we resolve a
                      // human identity from the head commit instead. Prefer the
                      // committer (who pushed); bot-created commits often keep
                      // the bot as committer, so fall back to the commit author.
                      // Same-repo branches are already required (the
                      // `head.repo.fork` check on this job), so a human
                      // committer can only have been a user with push access.
                      let userToCheck = prAuthor;
                      if (context.payload.pull_request.user.type === 'Bot') {
                          const { data: headCommit } = await github.rest.repos.getCommit({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              ref: context.payload.pull_request.head.sha,
                          });
                          const candidates = [
                              { label: 'committer', user: headCommit.committer },
                              { label: 'author', user: headCommit.author },
                          ];
                          const resolved = candidates.find(
                              ({ user }) => user?.login && user.type !== 'Bot'
                          );
                          if (!resolved) {
                              console.log(`⏭️ ${prAuthor} PR has no resolvable human committer/author — skipping auto-review`);
                              core.setOutput('is_member', 'false');
                              return;
                          }
                          console.log(`Resolved ${prAuthor} launcher to ${resolved.label}: ${resolved.user.login}`);
                          userToCheck = resolved.user.login;
                      }

                      try {
                          const { data } = await github.rest.teams.getMembershipForUserInOrg({
                              org: 'duckduckgo',
                              team_slug: 'core',
                              username: userToCheck
                          });
                          if (data.state === 'active') {
                              console.log(`✅ ${userToCheck} is an active member of duckduckgo/core`);
                              core.setOutput('is_member', 'true');
                          } else {
                              console.log(`⏭️ ${userToCheck} is not an active member — skipping auto-review`);
                              core.setOutput('is_member', 'false');
                          }
                      } catch (error) {
                          if (error.status === 404) {
                              console.log(`⏭️ ${userToCheck} is not a member of duckduckgo/core — skipping auto-review`);
                          } else {
                              console.log(`⚠️ Could not verify ${userToCheck}: ${error.message} (status: ${error.status})`);
                          }
                          core.setOutput('is_member', 'false');
                      }

    claude_auto_review:
        needs: check_membership
        if: needs.check_membership.outputs.is_member == 'true'
        runs-on: ubuntu-latest
        concurrency: claude-review-${{ github.event.pull_request.number }}

        steps:
            - name: Dismiss stale Dax approval on new push
              if: github.event.action == 'synchronize'
              uses: actions/github-script@v9
              with:
                  github-token: ${{ secrets.DAX_PAT }}
                  script: |
                      const reviews = await github.paginate(github.rest.pulls.listReviews, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.payload.pull_request.number
                      });

                      for (const review of reviews) {
                          if (review.state === 'APPROVED' && review.user.login === 'daxtheduck') {
                              await github.rest.pulls.dismissReview({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  pull_number: context.payload.pull_request.number,
                                  review_id: review.id,
                                  message: 'Dismissing stale approval — new commits pushed, awaiting Claude re-review.'
                              });
                              console.log(`Dismissed stale approval (review ${review.id})`);
                          }
                      }

            - name: Checkout base branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.base.ref }}
                  sparse-checkout: |
                      .github/REQUIRED_TEAMS
                      .github/scripts
                      .nvmrc
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Claude review
              id: review
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: node .github/scripts/claude-pr-review.mjs --profile general

            - name: Check for existing Dax approval
              uses: actions/github-script@v9
              id: check_reviews
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { DAX_USERNAME } = await import(`${process.cwd()}/.github/scripts/review-helpers.mjs`);
                      const reviews = await github.paginate(github.rest.pulls.listReviews, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.payload.pull_request.number
                      });
                      const has = reviews.some(r => r.state === 'APPROVED' && r.user.login === DAX_USERNAME);
                      console.log(`Found approved review from ${DAX_USERNAME}: ${has}`);
                      core.setOutput('has_approved_review', has);

            - name: Auto approve
              if: |
                  steps.review.outcome == 'success' &&
                  steps.review.outputs.is_low_risk == 'true' &&
                  steps.review.outputs.reviewed_head_sha == github.event.pull_request.head.sha &&
                  steps.check_reviews.outputs.has_approved_review == 'false'
              run: gh pr review --approve "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GITHUB_TOKEN: ${{ secrets.DAX_PAT }}

            - name: Find previous review comment
              if: |
                  steps.review.outcome != 'success' ||
                  steps.review.outputs.is_low_risk != 'true'
              uses: peter-evans/find-comment@v4
              id: find_comment
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-author: 'github-actions[bot]'
                  body-includes: 'requires a manual review'
                  direction: last

            - name: Post manual review required comment
              if: |
                  (steps.review.outcome != 'success' ||
                  steps.review.outputs.is_low_risk != 'true') &&
                  steps.find_comment.outputs.comment-id == ''
              uses: actions/github-script@v9
              env:
                  REVIEW_OUTCOME: ${{ steps.review.outcome }}
                  RISK_LEVEL: ${{ steps.review.outputs.risk_level }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { loadRequiredTeams, formatTeamList } = await import(`${process.cwd()}/.github/scripts/review-helpers.mjs`);
                      const teams = loadRequiredTeams();
                      const teamList = formatTeamList(teams);

                      const reviewRan = process.env.REVIEW_OUTCOME === 'success';
                      const riskLevel = process.env.RISK_LEVEL;

                      const reason = reviewRan
                          ? `Claude assessed this PR as **${riskLevel} Risk** (only Low Risk is auto-approved).`
                          : 'The Claude review did not complete.';

                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.payload.pull_request.number,
                          body: `⚠️ ${reason}\n\nThis PR requires a manual review and approval from a member of one of the following teams:\n\n${teamList}`
                      });
