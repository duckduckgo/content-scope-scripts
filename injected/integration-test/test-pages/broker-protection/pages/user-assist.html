<!DOCTYPE html>
<html>
<head>
    <title>User assist</title>
</head>
<body>
    <form id="optout-form">
        <div id="captcha-widget" style="width: 300px; height: 65px; border: 1px solid #ccc;">
            <input type="hidden" name="cf-turnstile-response">
            <button type="button" id="solve">I am human</button>
        </div>
        <button type="submit">Submit</button>
    </form>
    <script>
        document.getElementById('solve').addEventListener('click', () => {
            document.querySelector("input[name='cf-turnstile-response']").value = 'token';
        });
    </script>
</body>
</html>
