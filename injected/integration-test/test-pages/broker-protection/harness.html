<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PIR opt-out harness</title>
    <link rel="stylesheet" href="harness.css">
</head>
<body>
    <aside>
        <h1>PIR opt-out harness</h1>
        <p class="hint">Plays native's part of an opt-out against the fake site, with the integration build injected into each page. Run <code>npm run build</code> after changing C-S-S.</p>
        <form id="settings">
            <label><input type="checkbox" name="visualize"> Visualize actions</label>
            <label><input type="checkbox" name="turnstile" value="manual"> Turnstile needs a click</label>
            <label><input type="checkbox" name="hcaptcha" value="manual"> hCaptcha needs a click</label>
            <label>Pause between actions <input type="number" name="pauseMs" min="0" step="250"> ms</label>
        </form>
        <div class="controls">
            <button id="run" type="button">Run opt-out</button>
            <span id="status" role="status"></span>
        </div>
        <ol id="actions"></ol>
    </aside>
    <iframe title="Fake people search site" src="about:blank"></iframe>
    <script type="module" src="harness.js"></script>
</body>
</html>
