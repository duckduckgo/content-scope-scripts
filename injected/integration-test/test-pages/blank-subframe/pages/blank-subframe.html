<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Blank subframe</title>
</head>
<body>
    <iframe id="blank"></iframe>
    <script>
        /** @param {Document} doc */
        window.addTrackerScript = (doc, src) => {
            const script = doc.createElement('script');
            script.src = src;
            doc.head.appendChild(script);
        };
    </script>
</body>
</html>
