<!DOCTYPE html>
<html lang="en">

    <title>Numeric detectors: error text</title>
</head>
<body>
    <h1>Page not found</h1>
    <p>Sorry, the page you requested was not found. Error 404 Not Found.</p>

        // Text inside a script is not rendered, so this phrase is not counted: page not found
    </script>
</body>
