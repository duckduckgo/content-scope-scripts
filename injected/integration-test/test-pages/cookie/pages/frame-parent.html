<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Cookie frame parent</title>
</head>
<body>
    <p>Same-site frame on a sibling host, which the hostname guess calls third party.</p>
    <script>
        const frame = document.createElement('iframe');
        // docs.<site> frames drive.<site>
        const site = location.host.split('.').slice(1).join('.');
        frame.src = `${location.protocol}//drive.${site}/cookie/pages/frame.html`;
        document.body.appendChild(frame);
    </script>
</body>
</html>
