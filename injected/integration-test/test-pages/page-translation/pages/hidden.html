<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Hidden content</title>
</head>
<body>
    <p>Visible paragraph.</p>
    <nav style="display: none"><ul><li>Hidden menu item</li></ul></nav>
    <div hidden><p>Hidden by attribute.</p></div>
    <p style="visibility: hidden">Invisible paragraph.</p>
    <p style="opacity: 0">Faded paragraph.</p>
    <details><summary>Show more</summary><p>Collapsed answer.</p></details>
    <span style="display: none">Hidden inline text</span>
    <p>Read <span style="display: none">the hidden part</span> later.</p>
</body>
</html>
