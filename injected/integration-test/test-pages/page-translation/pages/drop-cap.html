<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Drop cap</title>
    <style>
        .drop { float: left; font-size: 3em; line-height: 1; }
    </style>
</head>
<body>
    <article>
        <p><span class="drop">A</span>iwa is the first word, and the whole paragraph must stay one unit.</p>
        <p>The second paragraph has no drop cap.</p>
    </article>
</body>
</html>
