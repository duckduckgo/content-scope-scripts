<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Block inside a link</title>
</head>
<body>
    <!-- A link wrapping a block: the li has no block child of its own, but the div is a block. -->
    <ul>
        <li><a href="#one"><div>Harbour reopens after storm repairs</div></a></li>
        <li><a href="#two"><div>Library extends its opening hours</div></a></li>
    </ul>
</body>
</html>
