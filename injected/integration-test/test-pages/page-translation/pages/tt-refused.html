<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Enforces Trusted Types and allows only a policy named "other", so ours is refused. -->
    <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'; trusted-types other">
    <title>Trusted Types policy refused</title>
</head>
<body>
    <p id="m">The <b>quick</b> brown <a id="m-link" href="#x">fox</a> jumps.</p>
    <h2>Plain heading</h2>
</body>
</html>
