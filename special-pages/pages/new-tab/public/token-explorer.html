<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Explorer — DDG Theme Colors</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #111111;
  --bg-header: #1c1c1e;
  --bg-block: #1a1a1c;
  --border: rgba(255,255,255,0.07);
  --border-header: rgba(255,255,255,0.08);
  --border-cell: rgba(255,255,255,0.05);
  --text: rgba(255,255,255,0.88);
  --text-muted: rgba(255,255,255,0.35);
  --text-dim: rgba(255,255,255,0.25);
  --text-search: #fff;
  --search-bg: rgba(255,255,255,0.07);
  --search-border: rgba(255,255,255,0.12);
  --search-focus-bg: rgba(255,255,255,0.10);
  --search-focus-border: rgba(255,255,255,0.3);
  --search-placeholder: rgba(255,255,255,0.3);
  --token-color: #A8A7FF;
  --token-dot: #7C7AFF;
  --token-bg: rgba(124,122,255,0.08);
  --token-bg-hover: rgba(124,122,255,0.14);
  --token-border: rgba(255,255,255,0.06);
  --swatch-border: rgba(255,255,255,0.15);
  --btn-bg: rgba(255,255,255,0.07);
  --btn-border: rgba(255,255,255,0.12);
  --btn-active-bg: rgba(255,255,255,0.16);
  --btn-active-border: rgba(255,255,255,0.3);
  --btn-text: rgba(255,255,255,0.55);
  --btn-active-text: rgba(255,255,255,0.9);
}

html[data-theme="light"] {
  --bg: #f2f2f7;
  --bg-header: #ffffff;
  --bg-block: #ffffff;
  --border: rgba(0,0,0,0.07);
  --border-header: rgba(0,0,0,0.08);
  --border-cell: rgba(0,0,0,0.05);
  --text: rgba(0,0,0,0.88);
  --text-muted: rgba(0,0,0,0.38);
  --text-dim: rgba(0,0,0,0.25);
  --text-search: #000;
  --search-bg: rgba(0,0,0,0.05);
  --search-border: rgba(0,0,0,0.12);
  --search-focus-bg: rgba(0,0,0,0.07);
  --search-focus-border: rgba(0,0,0,0.3);
  --search-placeholder: rgba(0,0,0,0.3);
  --token-color: #5B58E0;
  --token-dot: #5B58E0;
  --token-bg: rgba(91,88,224,0.07);
  --token-bg-hover: rgba(91,88,224,0.13);
  --token-border: rgba(0,0,0,0.06);
  --swatch-border: rgba(0,0,0,0.15);
  --btn-bg: rgba(0,0,0,0.05);
  --btn-border: rgba(0,0,0,0.12);
  --btn-active-bg: rgba(0,0,0,0.12);
  --btn-active-border: rgba(0,0,0,0.28);
  --btn-text: rgba(0,0,0,0.45);
  --btn-active-text: rgba(0,0,0,0.88);
}

@media (prefers-color-scheme: light) {
  html[data-theme="system"] {
    --bg: #f2f2f7;
    --bg-header: #ffffff;
    --bg-block: #ffffff;
    --border: rgba(0,0,0,0.07);
    --border-header: rgba(0,0,0,0.08);
    --border-cell: rgba(0,0,0,0.05);
    --text: rgba(0,0,0,0.88);
    --text-muted: rgba(0,0,0,0.38);
    --text-dim: rgba(0,0,0,0.25);
    --text-search: #000;
    --search-bg: rgba(0,0,0,0.05);
    --search-border: rgba(0,0,0,0.12);
    --search-focus-bg: rgba(0,0,0,0.07);
    --search-focus-border: rgba(0,0,0,0.3);
    --search-placeholder: rgba(0,0,0,0.3);
    --token-color: #5B58E0;
    --token-dot: #5B58E0;
    --token-bg: rgba(91,88,224,0.07);
    --token-bg-hover: rgba(91,88,224,0.13);
    --token-border: rgba(0,0,0,0.06);
    --swatch-border: rgba(0,0,0,0.15);
    --btn-bg: rgba(0,0,0,0.05);
    --btn-border: rgba(0,0,0,0.12);
    --btn-active-bg: rgba(0,0,0,0.12);
    --btn-active-border: rgba(0,0,0,0.28);
    --btn-text: rgba(0,0,0,0.45);
    --btn-active-text: rgba(0,0,0,0.88);
  }
}

html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; transition: background 0.15s, color 0.15s; }

header {
  padding: 12px 20px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-header);
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  transition: background 0.15s, border-color 0.15s;
}
h1 { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
#search {
  flex: 1;
  min-width: 200px;
  max-width: 440px;
  background: var(--search-bg);
  border: 1px solid var(--search-border);
  border-radius: 8px;
  color: var(--text-search);
  font-size: 13px;
  padding: 7px 12px;
  outline: none;
  transition: background 0.15s, border-color 0.15s;
}
#search:focus { border-color: var(--search-focus-border); background: var(--search-focus-bg); }
#search::placeholder { color: var(--search-placeholder); }
#count { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

.theme-switcher {
  display: flex;
  gap: 2px;
  margin-left: auto;
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  padding: 3px;
}
.theme-btn {
  background: none;
  border: none;
  border-radius: 5px;
  color: var(--btn-text);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  transition: background 0.1s, color 0.1s;
}
.theme-btn:hover { color: var(--btn-active-text); }
.theme-btn.active {
  background: var(--btn-active-bg);
  border: 1px solid var(--btn-active-border);
  color: var(--btn-active-text);
}

#results { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

.token-block {
  background: var(--bg-block);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: background 0.15s, border-color 0.15s;
}
.token-name {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--token-color);
  padding: 9px 14px;
  background: var(--token-bg);
  border-bottom: 1px solid var(--token-border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: all;
  transition: background 0.1s;
}
.token-name:hover { background: var(--token-bg-hover); }
.token-name::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--token-dot); flex-shrink: 0; }

.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}
.theme-cell {
  padding: 8px 14px;
  border-right: 1px solid var(--border-cell);
  border-bottom: 1px solid var(--border-cell);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color 0.15s;
}
.theme-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.mode-row { display: flex; align-items: center; gap: 7px; }
.mode-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); width: 28px; flex-shrink: 0; }
.swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--swatch-border); }
.color-val { font-family: 'SF Mono','Menlo',monospace; font-size: 11px; color: var(--text-muted); }

#empty { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; display: none; }
#footer { padding: 16px 20px; font-size: 11px; color: var(--text-dim); }

#category-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 20px 4px;
  border-top: 1px solid var(--border-header);
}
#filter-hint { padding: 4px 20px 10px; font-size: 10px; color: var(--text-dim); }
.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px 3px 7px;
  border-radius: 100px;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-text);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s, border-color 0.12s, color 0.12s, opacity 0.12s;
  letter-spacing: 0.01em;
}
.cat-chip:hover { color: var(--btn-active-text); border-color: var(--btn-active-border); }
.cat-chip.active {
  background: var(--btn-active-bg);
  border-color: var(--btn-active-border);
  color: var(--btn-active-text);
}
.cat-chip.inactive { opacity: 0.45; }
.cat-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
</style>
</head>
<body>

<header>
  <h1>Token Explorer</h1>
  <input id="search" type="search" placeholder="Search token, e.g. input-control, surface-tertiary..." autofocus>
  <span id="count"></span>
  <div class="theme-switcher">
    <button class="theme-btn" data-t="light">Light</button>
    <button class="theme-btn" data-t="dark">Dark</button>
    <button class="theme-btn" data-t="system">System</button>
  </div>
</header>

<div id="category-filter"></div>
<div id="filter-hint">Click to toggle · ⌘+click to solo</div>
<div id="results"></div>
<div id="empty">No tokens match your search.</div>
<div id="footer">Last updated: 2026-08-25 01:40 UTC</div>

", "w": "--ds-accent-secondary", "c": "#470FBF"}, {"t": "Violet", "m": "light", "w": "--ds-accent-tertiary", "c": "#3B0DA6"}, {"t": "Violet", "m": "light", "w": "--ds-accent-quaternary", "c": "#2C0A7B"}, {"t": "Violet", "m": "light", "w": "--ds-accent-glow-primary", "c": "rgba(92,23,229,0.2)"}, {"t": "Violet", "m": "light", "w": "--ds-accent-glow-secondary", "c": "rgba(92,23,229,0.12)"}, {"t": "Violet", "m": "dark", "w": "--ds-text-primary", "c": "rgba(7,5,13,0.96)"}];

// Group: token -> theme -> mode -> color
const byToken = {};
for (const r of RAW) {
  if (!byToken[r.w]) byToken[r.w] = {};
  if (!byToken[r.w][r.t]) byToken[r.w][r.t] = {};
  byToken[r.w][r.t][r.m] = r.c;
}

const tokenNames = Object.keys(byToken).sort();
const results = document.getElementById('results');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const search = document.getElementById('search');

// Theme switcher
const THEME_KEY = 'token-explorer-theme';
const html = document.documentElement;
const btns = document.querySelectorAll('.theme-btn');

function setTheme(t) {
  html.dataset.theme = t;
  localStorage.setItem(THEME_KEY, t);
  btns.forEach(b => b.classList.toggle('active', b.dataset.t === t));
}

btns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.t)));
setTheme(localStorage.getItem(THEME_KEY) || 'dark');

// Category filter
const allThemes = [...new Set(RAW.map(r => r.t))].sort();
const activeThemes = new Set(allThemes);

// Derive accent color for each theme from its accent-primary token
const themeAccent = {};
for (const r of RAW) {
  if (!themeAccent[r.t] && r.m === 'light' && r.w === '--ds-accent-primary') {
    themeAccent[r.t] = r.c;
  }
}
// Fallback: derive from surface-backdrop rgba
for (const r of RAW) {
  if (!themeAccent[r.t] && r.m === 'light' && r.w === '--ds-surface-backdrop') {
    const m = r.c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (m) themeAccent[r.t] = `rgb(${m[1]},${m[2]},${m[3]})`;
  }
}

const filterEl = document.getElementById('category-filter');
for (const theme of allThemes) {
  const chip = document.createElement('button');
  chip.className = 'cat-chip active';
  chip.dataset.theme = theme;

  const dot = document.createElement('span');
  dot.className = 'cat-dot';
  dot.style.background = themeAccent[theme] || 'var(--text-muted)';

  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(theme));
  chip.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey) {
      // Solo: select only this chip, deselect all others
      activeThemes.clear();
      activeThemes.add(theme);
      document.querySelectorAll('.cat-chip').forEach(c => {
        const isThis = c.dataset.theme === theme;
        c.classList.toggle('active', isThis);
        c.classList.toggle('inactive', !isThis);
      });
    } else {
      if (activeThemes.has(theme)) {
        activeThemes.delete(theme);
        chip.classList.remove('active');
        chip.classList.add('inactive');
      } else {
        activeThemes.add(theme);
        chip.classList.add('active');
        chip.classList.remove('inactive');
      }
    }
    render(search.value);
  });
  filterEl.appendChild(chip);
}

// Render
function render(query) {
  const q = query.trim().toLowerCase();
  const filtered = q ? tokenNames.filter(t => t.toLowerCase().includes(q)) : tokenNames;

  results.innerHTML = '';
  countEl.textContent = filtered.length + ' token' + (filtered.length !== 1 ? 's' : '');
  empty.style.display = filtered.length === 0 ? 'block' : 'none';

  for (const token of filtered) {
    const themes = byToken[token];
    const visibleThemes = Object.keys(themes).filter(t => activeThemes.has(t)).sort();
    if (visibleThemes.length === 0) continue;

    const block = document.createElement('div');
    block.className = 'token-block';

    const nameEl = document.createElement('div');
    nameEl.className = 'token-name';
    nameEl.textContent = token;
    nameEl.title = 'Click to copy';
    nameEl.addEventListener('click', () => navigator.clipboard.writeText(token));
    block.appendChild(nameEl);

    const grid = document.createElement('div');
    grid.className = 'theme-grid';

    for (const theme of visibleThemes) {
      const modes = themes[theme];
      const cell = document.createElement('div');
      cell.className = 'theme-cell';

      const label = document.createElement('div');
      label.className = 'theme-label';
      label.textContent = theme;
      cell.appendChild(label);

      for (const mode of ['light', 'dark']) {
        if (!modes[mode]) continue;
        const color = modes[mode];
        const row = document.createElement('div');
        row.className = 'mode-row';

        const badge = document.createElement('span');
        badge.className = 'mode-badge';
        badge.textContent = mode;

        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = color;

        const val = document.createElement('span');
        val.className = 'color-val';
        val.textContent = color;

        row.appendChild(badge);
        row.appendChild(swatch);
        row.appendChild(val);
        cell.appendChild(row);
      }

      grid.appendChild(cell);
    }

    block.appendChild(grid);
    results.appendChild(block);
  }
}

search.addEventListener('input', e => render(e.target.value));
render('');
